<!-- Available Stays Page - Shows all room types and their availability -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Available Stays</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="rooms">
  <!-- Main application container with sidebar navigation -->
  <div class="app-shell">
    <!-- Sidebar navigation - appears on all pages -->
    <aside class="sidebar">
      <!-- Brand logo and name -->
      <a class="brand" href="index.html">
        <span class="brand-mark">S</span>
        <span>StaySync</span>
      </a>
      <!-- Main navigation menu -->
      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html">StaySync Home</a>
        <a class="active" href="rooms.html">Available Stays</a>
        <a href="booking.html">Reserve a Room</a>
        <a href="manage.html">Booking Desk</a>
        <a href="admin.html">Staff Console</a>
      </nav>
    </aside>

    <main class="main-area">
      <!-- Page header with title and call-to-action -->
      <header class="topbar">
        <div>
          <p class="eyebrow">Inventory</p>
          <h1>Available Stays</h1>
        </div>
        <a class="primary-action" href="booking.html">Reserve a Room</a>
      </header>

      <!-- Room listing sections -->
      <section class="section-heading">
        <h2>Choose a stay profile</h2>
        <p>Each card includes a room type, nightly price, status, and booking action.</p>
      </section>
      <!-- Container where room cards are dynamically inserted by JavaScript -->
      <section class="room-grid" id="roomList"></section>
    </main>
  </div>

  <!-- Load the main JavaScript functionality -->
  <script src="script.js"></script>
</body>
</html>
